{% extends "base.html" %}
{% block title %}{{ t['add_site_title'] }} - Artem Sites{% endblock %}
{% block content %}
<h1>{{ t['add_site_title'] }}</h1>
<form method="post" class="card">
  <label for="name">{{ t['site_name'] }}</label>
  <input id="name" name="name" placeholder="e.g. Site E - Sharma Residence" required>
  <label for="location">{{ t['location_address'] }}</label>
  <input id="location" name="location" placeholder="e.g. Saket, New Delhi">
  <label for="type">{{ t['type'] }}</label>
  <select id="type" name="type">
    <option>Residential</option>
    <option>Commercial</option>
    <option>Turnkey</option>
    <option>Renovation</option>
  </select>
  <button class="btn big" type="submit">{{ t['save_site'] }}</button>
</form>
<p><a href="{{ url_for('dashboard') }}">&larr; {{ t['back'] }} {{ t['dashboard'] }}</a></p>
{% endblock %}
